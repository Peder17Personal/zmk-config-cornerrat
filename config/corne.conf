# Uncomment the following lines to enable
# y = yes | n = no

#general config
CONFIG_ZMK_KEYBOARD_NAME="CorneDog"

# Sleep settings
CONFIG_ZMK_SLEEP=y
#set to sleep after 10 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

#BLE config
#Boost BLE
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


#RGB settings
CONFIG_ZMK_RGB_UNDERGLOW=y

# Display settings
CONFIG_ZMK_DISPLAY=y
